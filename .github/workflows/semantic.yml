# The semantic package's test suite — the first CI this repository has had.
#
# It needs no secrets, and that is deliberate: every test is offline, and the
# manifest checks read the checkout that `actions/checkout` has already
# provided. Nothing here touches Supabase, so there is no credential to leak.
#
# Two settings are load-bearing rather than boilerplate:
#
#   fetch-depth: 0   the checkout test asserts the reviewed commit is an
#                    ancestor of HEAD, which a shallow clone cannot answer. It
#                    fails with a message saying so, but depth is the fix.
#   WRITTEN_REPOSITORY_PATH
#                    without it the two manifest tests skip. A green suite that
#                    quietly skipped the drift report is exactly the outcome
#                    this file exists to prevent.
name: semantic

on:
  push:
    paths:
      - 'semantic/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tools/replay_contracts.sh'
      - 'tools/compile_semantic_contract.py'
      # The budget program is the artifact the output_budget gate rests on and
      # was outside these paths, so a change to it triggered no CI at all.
      - 'tools/output_budget_report.py'
      - 'tools/ci/**'
      - '.github/workflows/semantic.yml'
  pull_request:
    paths:
      - 'semantic/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tools/replay_contracts.sh'
      - 'tools/compile_semantic_contract.py'
      # The budget program is the artifact the output_budget gate rests on and
      # was outside these paths, so a change to it triggered no CI at all.
      - 'tools/output_budget_report.py'
      - 'tools/ci/**'
      - '.github/workflows/semantic.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # **`pytest`, not `unittest discover`, and installing pytest alone would
      # not have been enough.** Seven test modules import pytest and define bare
      # `def test_*` functions rather than `TestCase` classes. Under
      # `unittest discover` they failed at import with `ModuleNotFoundError`,
      # which is how this workflow has been red since it was added — but adding
      # the dependency without changing the runner would have been worse: the
      # imports would succeed, `unittest` would find no `TestCase` in them, and
      # seven files' worth of tests would silently not run behind a green tick.
      #
      # pytest collects both styles, so the `TestCase` suites keep running and
      # the seven start to.
      #
      # **The same mistake was made one layer up and this line is the fix.**
      # `tools/compile_semantic_contract.py` reads `terms.xlsx` through
      # `openpyxl` and validates few-shots through `jsonschema`, and neither was
      # installed here. The two failed differently and the second is the one
      # this comment is about: the workbook tests *errored*, which is loud, while
      # the schema tests sat behind `pytest.importorskip` and **skipped behind a
      # green tick** — exactly the silent non-execution described above. Both are
      # declared in `semantic/pyproject.toml`'s `dev` extra; install what the
      # tests actually import, or they do not run.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest openpyxl jsonschema

      - name: Run the suite
        working-directory: semantic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
          WRITTEN_REPOSITORY_PATH: ${{ github.workspace }}
        run: python -m pytest tests -q

      - name: Deterministic demo
        working-directory: semantic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python -m written_ontology.cli demo

      # The `artifact_contract` gate. The compiled contract is the runtime input
      # and the workbook is where it is authored, so the two drifting is a
      # release-blocking fault rather than a stale file — and it is invisible
      # otherwise, because a contract that disagrees with its sources still
      # parses. Separate from the suite so the failure names the gate.
      - name: The contract still compiles to what is checked in
        run: python tools/compile_semantic_contract.py --check

  # The SQL half. Separate job because it needs Docker and takes minutes, while
  # the Python suite is offline and takes seconds — one failing should not
  # obscure the other, and the Python result should not wait on a container.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Pulled explicitly so a registry hiccup reads as a pull failure rather
      # than as Postgres never becoming ready. That worked: the run of
      # 2026-08-13 failed here with `toomanyrequests: Rate exceeded`, named
      # plainly, and nothing downstream had to be diagnosed.
      #
      # **Retried because the failure is the registry's, not this repository's.**
      # A public ECR pull is rate limited per source address, and a CI runner
      # shares its address with everybody else on that host — so the same commit
      # passes or fails depending on who else is building. Three attempts with a
      # widening gap; a genuine bad tag still fails, just three times slower.
      - name: Pull the Supabase Postgres image
        run: |
          for attempt in 1 2 3; do
            if docker pull public.ecr.aws/supabase/postgres:17.6.1.156; then
              exit 0
            fi
            echo "pull attempt $attempt failed; waiting $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::could not pull the Postgres image after three attempts"
          exit 1

      # Replays 0001 -> 0049 from empty three times and runs all eight adapted
      # contracts at the migration each one gates, plus the two fixture upgrade
      # lanes and the private-schema grant check. Identical to what runs
      # locally: the logic is in the script, not in this file.
      - name: Replay the chain and run the contracts
        run: ./tools/replay_contracts.sh
