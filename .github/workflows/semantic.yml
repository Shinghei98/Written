# The semantic package's test suite — the first CI this repository has had.
#
# It needs no secrets, and that is deliberate: every test is offline, and the
# manifest checks read the checkout that `actions/checkout` has already
# provided. Nothing here touches Supabase, so there is no credential to leak.
#
# Two settings are load-bearing rather than boilerplate:
#
#   fetch-depth: 0   the checkout test asserts the reviewed commit is an
#                    ancestor of HEAD, which a shallow clone cannot answer. It
#                    fails with a message saying so, but depth is the fix.
#   WRITTEN_REPOSITORY_PATH
#                    without it the two manifest tests skip. A green suite that
#                    quietly skipped the drift report is exactly the outcome
#                    this file exists to prevent.
name: semantic

on:
  push:
    paths:
      - 'semantic/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tools/replay_contracts.sh'
      - 'tools/ci/**'
      - '.github/workflows/semantic.yml'
  pull_request:
    paths:
      - 'semantic/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tools/replay_contracts.sh'
      - 'tools/ci/**'
      - '.github/workflows/semantic.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the suite
        working-directory: semantic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
          WRITTEN_REPOSITORY_PATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Deterministic demo
        working-directory: semantic
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python -m written_ontology.cli demo

  # The SQL half. Separate job because it needs Docker and takes minutes, while
  # the Python suite is offline and takes seconds — one failing should not
  # obscure the other, and the Python result should not wait on a container.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pulled explicitly so a registry hiccup reads as a pull failure rather
      # than as Postgres never becoming ready.
      - name: Pull the Supabase Postgres image
        run: docker pull public.ecr.aws/supabase/postgres:17.6.1.156

      # Replays 0001 -> 0049 from empty three times and runs all eight adapted
      # contracts at the migration each one gates, plus the two fixture upgrade
      # lanes and the private-schema grant check. Identical to what runs
      # locally: the logic is in the script, not in this file.
      - name: Replay the chain and run the contracts
        run: ./tools/replay_contracts.sh
