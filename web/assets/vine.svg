<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 460" width="220" height="460">
  <!--
    One tile of the vine. It is repeated down the page rather than stretched,
    so the plant is the same weight whatever the prose beside it costs.

    The stem enters at (110, 0) and leaves at (110, 460), and both ends carry a
    vertical tangent — the first control point sits directly below the start and
    the last directly above the end. That is what makes the repeat seamless; a
    stem that merely arrives at the right x still shows a kink at every tile
    boundary.
  -->
  <g fill="none" stroke="#1B221A" stroke-linecap="round">
    <path d="M110 0 C110 34 90 64 90 104 C90 146 130 168 130 210
             C130 252 94 274 94 316 C94 358 110 420 110 460" stroke-width="7"/>

    <!-- reaching left -->
    <path d="M92 96 C64 92 40 100 20 122" stroke-width="3.2"/>
    <path d="M118 336 C92 340 66 356 52 380" stroke-width="3.2"/>

    <!-- reaching right -->
    <path d="M128 196 C156 194 182 206 200 232" stroke-width="3.2"/>
    <path d="M96 300 C124 306 148 324 160 350" stroke-width="2.6"/>

    <!-- a tendril, because a vine that only branches reads as a diagram -->
    <path d="M91 138 C70 136 62 152 72 162 C81 171 92 164 87 155" stroke-width="2.4"/>
  </g>

  <g fill="#1B221A">
    <path d="M20 122 C40 104 44 80 28 62 C8 76 4 102 20 122 Z"/>
    <path d="M200 232 C180 214 178 190 194 174 C212 186 216 212 200 232 Z"/>
    <path d="M52 380 C72 362 76 338 60 320 C40 334 36 360 52 380 Z"/>
    <path d="M160 350 C144 336 142 316 156 302 C171 313 174 335 160 350 Z"/>
    <circle cx="132" cy="238" r="5.5"/>
  </g>
</svg>
