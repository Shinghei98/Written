AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The Written extraction gateway: a Lambda container invoked directly by the
  semantic worker over IAM, and the encrypted bucket SageMaker asynchronous
  inference hands objects through. No function URL, no API Gateway, no public
  surface — the only caller is a principal AWS has already authenticated.

  The SageMaker endpoint itself is a separate stack. It costs money whenever it
  is up, and a template that created it as a side effect of deploying the
  gateway would make that a surprise rather than a decision.

Parameters:
  ImageUri:
    Type: String
    Description: The gateway image in ECR, by digest rather than by tag.
  ModelId:
    Type: String
    Default: Qwen/Qwen3.5-9B
  ModelRevision:
    Type: String
    Default: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    Description: The staged revision, reconciled against its manifest.
  TokenizerSha256:
    Type: String
    Default: 5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42
    Description: tokenizer.json's digest from the staged manifest.
  ServingImageDigest:
    Type: String
    Default: sha256:28e6e9d9dc18763ee091468600ad5c4dc54e778b5f5bc0aede375680bdaf186d
  GatewayImageDigest:
    Type: String
    Description: >
      The digest of the image this function runs. **Declared, not measured** —
      a process cannot learn its own image digest from inside it, which is why
      `gateway_revision` exists beside it and is the value actually compared.
  SagemakerEndpointName:
    Type: String
    Default: ''
    Description: >
      The serving endpoint, when one exists. **Passed in, never imported.** A
      CloudFormation export/import would make the gateway stack a consumer of the
      serving stack and block deleting it — and that stack is deliberately
      disposable, torn down after every pass. So the endpoint's name travels as a
      parameter set by a controlled gateway update, and is cleared again on
      teardown. Empty means no transport is configured, which is what `off`
      should look like.
  WorkerRoleArn:
    Type: String
    Default: arn:aws:iam::616040526027:role/written-semantic-worker
    Description: The one principal permitted to invoke the gateway.

Resources:
  AsyncBucket:
    Type: AWS::S3::Bucket
    # Retained on stack delete: an object here is provider text and the
    # lifecycle rule is what removes it, not a stack operation nobody reviewed.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub written-semantic-async-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # **No versioning.** A version history of deleted provider text is a
      # retention surface with no owner and no erasure path.
      VersioningConfiguration:
        Status: Suspended
      LifecycleConfiguration:
        Rules:
          # The transport deletes both objects as it reads them. This is the
          # backstop for the call that times out mid-flight, which is a real
          # shape rather than a hypothetical.
          - Id: expire-anything-the-sweep-missed
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-semantic-gateway
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: async-objects-and-one-endpoint
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read, write and *delete* — the delete is not incidental, it is
              # how the retention surface is closed on every call.
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub '${AsyncBucket.Arn}/async/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AsyncBucket.Arn
              # **The tickets, and nothing else in DynamoDB.** A ticket records
              # which job is running, never what it is about: a request id, an
              # inference id and two object keys. No scan and no query — a
              # ticket is only ever fetched by the id the caller already holds,
              # so the wider verbs would buy the ability to enumerate other
              # people's in-flight work and nothing else.
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:DeleteItem]
                Resource: !GetAtt TicketTable.Arn
              - Effect: Allow
                Action: sagemaker:InvokeEndpointAsync
                # **The named endpoint, not the family.** `written-qwen-*` let
                # this function invoke any endpoint whose name began that way,
                # including one somebody stood up by hand and nobody attested.
                # When no endpoint is configured the ARN names the empty string
                # and matches nothing, which is the correct amount of reach for a
                # deployment with no model.
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/${SagemakerEndpointName}

  GatewayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: written-semantic-gateway
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Role: !GetAtt GatewayRole.Arn
      # Async inference queues; the wait is the point of the timeout.
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          WRITTEN_ASYNC_BUCKET: !Ref AsyncBucket
          WRITTEN_ASYNC_PREFIX: async
          WRITTEN_TICKET_TABLE: !Ref TicketTable
          # **These five make `build_deployment` return something.** Without
          # them it answers None, `attestation` reports `loaded: null`, and
          # `matches` is null — so there is no `matches.gateway_revision` to be
          # true or false. Four are declarations about artifacts this process
          # has not spoken to; the fifth, `gateway_revision`, is measured from
          # the files in this image and is the one that can actually disagree.
          WRITTEN_MODEL_ID: !Ref ModelId
          WRITTEN_MODEL_REVISION: !Ref ModelRevision
          WRITTEN_TOKENIZER_SHA256: !Ref TokenizerSha256
          WRITTEN_SERVING_IMAGE_DIGEST: !Ref ServingImageDigest
          WRITTEN_GATEWAY_IMAGE_DIGEST: !Ref GatewayImageDigest
          WRITTEN_ENVIRONMENT: production
          # Empty until an endpoint exists. `handler._transport()` returns None
          # without it, so extraction refuses for want of a transport rather
          # than by a flag — which is the honest state and is what the tests
          # assert.
          WRITTEN_SAGEMAKER_ENDPOINT: !Ref SagemakerEndpointName
          # Deliberately unset: the image
          # digests. With no endpoint the transport is None, which is what
          # `off` should look like from the inside as well as the outside.

  # **One principal, named.** Not a wildcard and not an account-wide grant: the
  # worker is the only thing that may call this, and a second caller should have
  # to appear here first.
  InvokeFromWorker:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GatewayFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Ref WorkerRoleArn

  # **Where an accepted inference is remembered between invocations.**
  # Polling used to end in a discarded ticket, so the first request to a
  # scaled-to-zero endpoint was abandoned along with the GPU-minutes that
  # produced its answer. This is what a later call reads to collect it.
  #
  # `PAY_PER_REQUEST` because the lane is bursty and idle most of the day, and a
  # TTL because a ticket nobody collects is worthless — the *answer's* retention
  # is handled where it always was, by deleting it before it is parsed.
  TicketTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub written-semantic-tickets-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        # Deliberately off. Point-in-time recovery would keep copies of rows
        # whose whole purpose is to expire, and there is nothing here worth
        # recovering: a lost ticket costs one abandoned answer, and restoring
        # one would resurrect a pointer to an object already deleted.
        PointInTimeRecoveryEnabled: false

Outputs:
  GatewayFunctionArn:
    Value: !GetAtt GatewayFunction.Arn
  TicketTableName:
    Value: !Ref TicketTable
  AsyncBucketName:
    Value: !Ref AsyncBucket
