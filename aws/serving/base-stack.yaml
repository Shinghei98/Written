AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Persistent artifacts for the Qwen lane: the model bucket, its key, the serving
  image repository, and the two CodeBuild jobs that fill them.

  Deliberately separate from the GPU. Everything here is durable and costs
  almost nothing idle; the endpoint is disposable and costs money whenever it is
  up, so it lives in its own stack and is created only once the artifacts it
  needs already exist.

  Neither job is VPC-attached: one needs public Hugging Face access and the
  other needs public package registries, and neither handles user data. That is
  the whole reason the model bucket is separate from the async bucket — these
  are immutable public model artifacts, not retained provider text, and they get
  versioning for exactly the reason the async bucket must not.

Parameters:
  ModelId:
    Type: String
    Default: Qwen/Qwen3.5-9B
  ModelRevision:
    Type: String
    Default: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    Description: The complete Hugging Face commit SHA. Never a branch name.
  VllmVersion:
    Type: String
    Default: ''
    Description: >
      **No default, deliberately.** `0.11.0` was pinned because it installed
      cleanly, which is not the same as being able to run this model: 0.11's
      release notes do not list the architecture. An engine that installs and
      cannot load the weights fails at first inference, on a GPU that is already
      billing, and reads as a bad artifact rather than a wrong engine.

      **0.27.1 is the pin, chosen against 0.27.0's release notes**, which add
      "Qwen3.5 text-only dense and MoE models". Leaving this empty makes the
      build refuse instead of quietly repeating an unverified pin.

      **The plain release, never a local version.** The ECR tag is derived from
      this string and `+` is not a legal Docker tag character, so a value like
      `0.27.1+cu129` fails at `docker build -t` before anything is learned. The
      CUDA variant is named by the wheel below; this names the release, and the
      build asserts the installed engine reports a version starting with it.
  VllmWheelUrl:
    Type: String
    Default: ''
    Description: >
      The exact wheel, by URL, because PyPI cannot host it: PEP 440 forbids
      local version identifiers there, so `vllm==0.27.1+cu129` is unresolvable
      and the `+cu129` build lives on the GitHub release instead.

      **What this buys is reproducibility, not CUDA.** vLLM's default PyPI wheel
      for a given release is already built against CUDA 12.9, so this is the
      same binary under a label that says so. It is pinned by hash for the same
      reason the CUDA base and the serving image are pinned by digest — the
      house rule is that an identity which can be repointed is not an identity.
  VllmWheelSha256:
    Type: String
    Default: ''
    Description: >
      The wheel's sha256, verified before it is installed. A URL alone names a
      location rather than an artifact.
  TorchPin:
    Type: String
    Default: ''
    Description: >
      The torch requirement, named with its local version — e.g.
      `torch==2.13.0+cu129`.

      **The engine names its torch by version and the version does not say which
      CUDA.** vLLM's wheel asks for `torch==2.13.0`, which both PyPI and the
      cu129 index satisfy; offering the cu129 index alongside PyPI was not enough
      to decide it, and pip took PyPI's CUDA 13 build while correctly taking
      `torchvision==0.28.0+cu129` from the index in the same command. Naming the
      artifact is what removes the ambiguity — the same rule the wheel URL and
      the image digests follow.

      It must agree with whatever the pinned vLLM wheel requires. If it stops
      agreeing, pip raises a resolution conflict, which is the loud failure to
      prefer over a silently mismatched runtime.
  CudaBaseDigest:
    Type: String
    Default: sha256:d02c4310b6d57ca0b16cd80298bdb33a74187baafe2eccd8a6a16180ddc90802
    Description: >
      nvidia/cuda:12.9.1-cudnn-runtime-ubuntu24.04, by digest. A tag can be
      repointed and the image would change without the manifest noticing, which
      is the same reason the gateway deploys by digest rather than by tag.

      **Pulled from `nvcr.io`, NVIDIA's own registry, not Docker Hub.** Docker
      Hub rate-limits unauthenticated pulls per IP and a build failed on
      `429 toomanyrequests` after an earlier one on the same address had spent
      the quota — a failure that says nothing about the image and costs a whole
      build to discover. NGC serves this **byte-identical digest** with no such
      limit, so the pin is unchanged and only where the bytes come from moved.

      **12.9 rather than 12.4, and it forces the entrypoint shim below.** The
      engine wheel is a CUDA 12.9 build, so the base has to match it — and
      SageMaker's newest inference AMI runs driver 550.144.01 with CUDA 12.4,
      the one before it 535 with 12.2. A 12.9 runtime on either needs CUDA
      forward compatibility, which is why this image ships
      `/usr/local/cuda/compat` (the `cuda-compat` package every nvidia/cuda
      image carries) and why the entrypoint decides at boot whether to use it.
      Measured on the real host: driver **535.309.01**, compat ceiling
      575.57.08, compat engaged.

      **24.04 rather than 22.04, and the reason is Python.** 22.04 gives Python
      3.10, and vLLM's `flashinfer` dependency annotates
      `array.array[int]` at module scope — evaluated at import, so it raises
      `TypeError: 'type' object is not subscriptable` and the engine dies before
      loading a single weight. 24.04 gives 3.12. It cost a model load on a
      billing GPU to learn, because every gate imported `vllm` itself and the
      failure is two lazily-imported modules deeper.

Resources:
  ModelKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Written model artifacts
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
  ModelKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/written-semantic-models
      TargetKeyId: !Ref ModelKey

  ModelBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub written-semantic-models-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ModelKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # **Versioning on, unlike the async bucket, and for the opposite reason.**
      # These are immutable public model files. A version history of them is a
      # record of what was deployed; a version history of provider text would be
      # a retention surface with no erasure path.
      VersioningConfiguration:
        Status: Enabled

  ServingRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: written-qwen-serving
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }

  # -- the weights job ------------------------------------------------------
  StageWeightsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-stage-weights
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-one-prefix-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ModelBucket.Arn
                  - !Sub '${ModelBucket.Arn}/models/*'
              # **No delete.** A write-once prefix that the writer could empty
              # is not write-once.
              - Effect: Allow
                Action: [kms:GenerateDataKey, kms:Decrypt]
                Resource: !GetAtt ModelKey.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*

  StageWeights:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: written-stage-qwen-weights
      ServiceRole: !GetAtt StageWeightsRole.Arn
      TimeoutInMinutes: 180
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: MODEL_ID
            Value: !Ref ModelId
          - Name: MODEL_REVISION
            Value: !Ref ModelRevision
          - Name: MODEL_BUCKET
            Value: !Ref ModelBucket
          - Name: KMS_KEY_ID
            Value: !Ref ModelKey
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - pip install --quiet "huggingface_hub[cli]==0.35.3"
            build:
              # **One command, because `set -e` does not survive the list.**
              # CodeBuild runs each list entry in its own shell, so a `set -euo
              # pipefail` in the first is not in force for the fifth — which is
              # how the first attempt reached the manifest step with a download
              # that had not finished, and reported the wrong failure.
              commands:
                - |
                  set -euo pipefail
                  # **A layout version in the prefix.** `manifest.json` used to
                  # sit beside `artifacts/`, which is outside the tree SageMaker
                  # mounts — so `/opt/ml/model/manifest.json` did not exist and
                  # the container could not say what it had loaded. Fixing that
                  # means moving an object inside an already-committed prefix,
                  # and a committed prefix is immutable by construction: the
                  # marker's whole meaning is that what it describes is final.
                  #
                  # So this is a new prefix rather than an edit. The old one
                  # stays exactly as it was, still valid, still reconciled.
                  LAYOUT="v2"
                  # **Exported.** A shell assignment is not an environment
                  # variable, and the reconcile step below reads
                  # `os.environ["PREFIX"]` — so the build failed with a KeyError
                  # after the weights were uploaded and before the marker,
                  # leaving a prefix that looks staged and is not committed.
                  export PREFIX="models/qwen3.5-9b/${MODEL_REVISION}/${LAYOUT}"
                  export MODEL_BUCKET

                  # A complete sha, never a branch: a branch can move under a
                  # tag and the deployment would silently change.
                  python3 - <<'PY'
                  import os, re, sys
                  rev = os.environ["MODEL_REVISION"]
                  if not re.fullmatch(r"[0-9a-f]{40}", rev):
                      sys.exit(f"MODEL_REVISION {rev!r} is not a complete commit sha")
                  PY

                  # Refuse an already-committed revision rather than write over it.
                  if aws s3api head-object --bucket "$MODEL_BUCKET" \
                       --key "$PREFIX/COMMITTED.json" >/dev/null 2>&1; then
                    echo "revision already committed; refusing to restage"; exit 1
                  fi

                  mkdir -p /tmp/model
                  hf download "$MODEL_ID" --revision "$MODEL_REVISION" \
                    --local-dir /tmp/model --max-workers 8

                  python3 - <<'PY'
                  import hashlib, json, os, pathlib, sys
                  root = pathlib.Path("/tmp/model")

                  # **`.cache` is the downloader's scratch, not model content.**
                  # `hf download --local-dir` keeps its partials under
                  # `.cache/huggingface/download`, and the first version refused
                  # the whole stage for a dotted path — reporting an unexpected
                  # path when what had actually happened was an unfinished
                  # download.
                  incomplete = list(root.rglob("*.incomplete"))
                  if incomplete:
                      sys.exit(f"{len(incomplete)} file(s) still downloading; refusing to stage a partial revision")

                  rows, total = [], 0
                  for path in sorted(root.rglob("*")):
                      rel = path.relative_to(root)
                      if rel.parts and rel.parts[0] == ".cache":
                          continue
                      if path.is_symlink():
                          sys.exit(f"symlink refused: {rel}")
                      if path.is_dir():
                          continue
                      name = str(rel)
                      # **Traversal is the danger; a leading dot is not.** The
                      # first version refused any dotted path and died on
                      # `.gitattributes`, which is an ordinary file in the
                      # repository — hidden-ness was standing in for a threat it
                      # is not. `..` is checked on the parts rather than as a
                      # substring, so a file genuinely named `a..b` is not
                      # mistaken for an escape.
                      if ".." in rel.parts or rel.is_absolute():
                          sys.exit(f"path escapes the model directory: {name}")
                      digest = hashlib.sha256(path.read_bytes()).hexdigest()
                      rows.append({"path": name, "bytes": path.stat().st_size,
                                   "sha256": digest})
                      total += path.stat().st_size

                  # A stage that hashed nothing is a stage that downloaded
                  # nothing, and the marker must not vouch for it.
                  if not rows:
                      sys.exit("no files to stage")
                  if total < 15_000_000_000:
                      sys.exit(f"only {total/1e9:.1f} GB present; the repository is about 19.3 GB")

                  manifest = {
                      "model_id": os.environ["MODEL_ID"],
                      "model_revision": os.environ["MODEL_REVISION"],
                      "codebuild_id": os.environ.get("CODEBUILD_BUILD_ID"),
                      "source_commit": os.environ.get("WRITTEN_SOURCE_COMMIT"),
                      "file_count": len(rows), "total_bytes": total,
                      "files": rows,
                  }
                  pathlib.Path("/tmp/manifest.json").write_text(
                      json.dumps(manifest, indent=2, sort_keys=True))
                  print(f"{len(rows)} files, {total/1e9:.1f} GB")
                  PY

                  # **The tokenizer runtime manifest is not written here.**
                  # It names the library versions that interpret the tokenizer,
                  # and this job has no vLLM, no transformers and no GPU — so
                  # the only manifest it could write would record nulls where
                  # the container records real versions, and the two digests
                  # would differ by construction. Every answer would then be
                  # refused for a drift that was manufactured at staging time.
                  #
                  # A runtime is measured by the thing running it. The container
                  # computes this at load, through the same
                  # `tokenizer_runtime.py`, and it is pinned from what it
                  # reports rather than from what this job guessed.

                  # Uncompressed, so SageMaker mounts the hierarchy directly
                  # through ModelDataSource. No 20 GB tarball to unpack on a GPU.
                  aws s3 sync /tmp/model "s3://$MODEL_BUCKET/$PREFIX/artifacts/" \
                    --exclude '.cache/*' \
                    --sse aws:kms --sse-kms-key-id "$KMS_KEY_ID" --only-show-errors

                  # **Inside the mounted tree**, so the container finds it at
                  # `/opt/ml/model/manifest.json`. Without this the runtime block
                  # reported no model id, revision or tokenizer, and the
                  # gateway's drift check — which treats a missing fact as a
                  # mismatch — refused every answer.
                  aws s3api put-object --bucket "$MODEL_BUCKET" \
                    --key "$PREFIX/artifacts/manifest.json" \
                    --body /tmp/manifest.json \
                    --server-side-encryption aws:kms \
                    --ssekms-key-id "$KMS_KEY_ID" >/dev/null

                  # And a copy outside it, because operational tooling reads the
                  # manifest without mounting anything.
                  aws s3api put-object --bucket "$MODEL_BUCKET" \
                    --key "$PREFIX/manifest.json" --body /tmp/manifest.json \
                    --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY_ID" >/dev/null

                  # **Reconciled before the marker, not after.** The marker means
                  # what it describes is final, so anything worth checking is
                  # worth checking first.
                  python3 - <<'PY'
                  import json, os, pathlib, subprocess, sys

                  prefix = os.environ["PREFIX"]; bucket = os.environ["MODEL_BUCKET"]
                  local = json.loads(pathlib.Path("/tmp/manifest.json").read_text())
                  listing = json.loads(subprocess.run(
                      ["aws", "s3api", "list-objects-v2", "--bucket", bucket,
                       "--prefix", f"{prefix}/artifacts/", "--output", "json"],
                      capture_output=True, text=True, check=True).stdout or "{}")
                  have = {o["Key"].split("/artifacts/", 1)[1]: o["Size"]
                          for o in listing.get("Contents", [])}

                  # The two manifests live in the tree and are not weights.
                  have.pop("manifest.json", None)

                  missing = [f["path"] for f in local["files"] if f["path"] not in have]
                  mismatched = [f["path"] for f in local["files"]
                                if f["path"] in have and have[f["path"]] != f["bytes"]]
                  if missing or mismatched:
                      sys.exit(f"missing={missing} mismatched={mismatched}")
                  if sum(have.values()) != local["total_bytes"]:
                      sys.exit(f"total bytes {sum(have.values())} != {local['total_bytes']}")
                  if len(have) != local["file_count"]:
                      sys.exit(f"object count {len(have)} != {local['file_count']}")
                  print(f"reconciled {len(have)} objects, {sum(have.values())} bytes")
                  PY

                  # **Written last, and only if nothing is there.** The endpoint
                  # may use a revision only when this exists, so a half-finished
                  # stage is unusable rather than subtly wrong.
                  printf '{"model_id":"%s","model_revision":"%s","codebuild_id":"%s"}' \
                    "$MODEL_ID" "$MODEL_REVISION" "$CODEBUILD_BUILD_ID" > /tmp/committed.json
                  aws s3api put-object --bucket "$MODEL_BUCKET" \
                    --key "$PREFIX/COMMITTED.json" --body /tmp/committed.json \
                    --if-none-match '*' \
                    --server-side-encryption aws:kms --ssekms-key-id "$KMS_KEY_ID" >/dev/null
                  echo "committed s3://$MODEL_BUCKET/$PREFIX/"

  # -- the image job --------------------------------------------------------
  BuildImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-build-serving-image
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: push-one-repository-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !GetAtt ServingRepository.Arn
              # **No model-bucket access at all.** The weights stay out of the
              # image, and a builder that could read them might put them in.
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*

  BuildImage:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: written-build-qwen-serving-image
      ServiceRole: !GetAtt BuildImageRole.Arn
      TimeoutInMinutes: 180
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: VLLM_VERSION
            Value: !Ref VllmVersion
          - Name: VLLM_WHEEL_URL
            Value: !Ref VllmWheelUrl
          - Name: VLLM_WHEEL_SHA256
            Value: !Ref VllmWheelSha256
          - Name: TORCH_PIN
            Value: !Ref TorchPin
          - Name: CUDA_BASE_DIGEST
            Value: !Ref CudaBaseDigest
          - Name: REPOSITORY
            Value: !Ref ServingRepository
          - Name: ACCOUNT
            Value: !Ref 'AWS::AccountId'
          - Name: REGION
            Value: !Ref 'AWS::Region'
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - set -euo pipefail
                - aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
                # **The commit component is checked, not the whole tag.**
                # `CODEBUILD_RESOLVED_SOURCE_VERSION` is empty under NO_SOURCE,
                # and the guard that was meant to catch that tested `$TAG` —
                # which is never empty, because the `vllm-0.11.0-` prefix is
                # always there. It could not fire, and it shipped an image
                # tagged `vllm-0.11.0-` naming no commit at all. Worse than
                # cosmetic: with the component gone the tag is a constant, and
                # an IMMUTABLE repository refuses the next push.
                #
                # `WRITTEN_SOURCE_COMMIT` is the pin already — it is what the
                # serve.py fetch below resolves — so the tag uses the same fact
                # rather than a second one that can disagree with it.
                # No `set -eu` here: CodeBuild runs these entries in one
                # shell session, so a shell option set in this block would
                # silently govern every command after it. The check below is
                # explicit instead, and CodeBuild fails the build on `exit 1`.
                - |
                  # **Refused rather than defaulted**, for the reason in the
                  # parameter description: an engine that cannot load Qwen3.5
                  # fails on a billing GPU and looks like a bad artifact.
                  if [ -z "${VLLM_VERSION:-}" ]; then
                    echo "VLLM_VERSION is unset. Pin a build verified against the Qwen3.5 model card — 0.11.0 installs but is not listed as supporting this architecture." >&2
                    exit 1
                  fi
                  # **A URL names a location; a hash names an artifact.** Both
                  # or neither: a URL with no hash would install whatever that
                  # address serves today, which is the thing digest pinning
                  # exists to refuse everywhere else in this file.
                  if [ -z "${VLLM_WHEEL_URL:-}" ] || [ -z "${VLLM_WHEEL_SHA256:-}" ]; then
                    echo "VLLM_WHEEL_URL and VLLM_WHEEL_SHA256 must both be set. PyPI cannot serve a +cu129 wheel — PEP 440 forbids local versions there — so the artifact is named by URL and pinned by hash." >&2
                    exit 1
                  fi
                  if [ -z "${TORCH_PIN:-}" ]; then
                    echo "TORCH_PIN is unset. The engine asks for a torch version and a version does not say which CUDA; unnamed, pip takes PyPI's CUDA 13 build under a cu129 engine." >&2
                    exit 1
                  fi

                  COMMIT="$(printf '%s' "${WRITTEN_SOURCE_COMMIT:-}" | cut -c1-12)"
                  if [ -z "$COMMIT" ]; then
                    echo "WRITTEN_SOURCE_COMMIT is unset. A tag that cannot name its commit is worse than a build that stops." >&2
                    exit 1
                  fi
                  TAG="vllm-${VLLM_VERSION}-${COMMIT}"
                  echo "SERVING_IMAGE_TAG=$TAG"
                - URI="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY"
            build:
              commands:
                # The serving shim, from the pinned source revision. NO_SOURCE
                # means nothing is checked out, so it is fetched by commit
                # rather than by branch — the same rule the weights follow.
                - |
                  # **Both files.** `serve.py` imports `tokenizer_runtime`, and
                  # fetching only the first left the container unable to compute
                  # the manifest digest at all — reported as absent, which the
                  # gateway's drift check reads as a mismatch, which refuses
                  # every answer.
                  for MODULE in serve tokenizer_runtime; do
                    curl -fsSL -o "$MODULE.py" \
                      "https://raw.githubusercontent.com/Shinghei98/Written/$WRITTEN_SOURCE_COMMIT/aws/serving/$MODULE.py"
                    test -s "$MODULE.py"
                  done
                  # **And the schema, so the structured-output gate below tests
                  # ours rather than a representative one.** It is not copied
                  # into the image — the gateway sends the schema with every
                  # request and a second copy in the container would be a second
                  # thing that can disagree with the contract.
                  curl -fsSL -o output_schema.json \
                    "https://raw.githubusercontent.com/Shinghei98/Written/$WRITTEN_SOURCE_COMMIT/semantic/contracts/mention_extract_v2.schema.json"
                  test -s output_schema.json

                # **The torch index is not optional, and `pip check` cannot
                # see why.** Resolved against PyPI alone, a `+cu129` vLLM pulled
                # `torch-2.13.0` built for **CUDA 13** — `nvidia_cudnn_cu13`,
                # `nvidia_nccl_cu13`, `nvidia_cusparselt_cu13` — which is a
                # consistent dependency graph and the wrong one. CUDA 13 wants a
                # driver of 580 or better; the host is 550 and this image's
                # compat libraries reach 575.57.08, so it would have failed on a
                # billing GPU with a message about neither.
                #
                # `--extra-index-url` rather than `--index-url`: the same version
                # carrying a local tag sorts above the plain one under PEP 440,
                # so pip prefers `2.13.0+cu129` while everything else still comes
                # from PyPI. It is what vLLM's own variant-install docs show.

                # **The wheel, fetched here and verified before the build.**
                # Downloading inside the Dockerfile would put the hash check in
                # a layer whose failure is easy to read as a network blip; doing
                # it in the build context means an artifact that is not the one
                # named never reaches `docker build` at all.
                - |
                  WHEEL="$(basename "${VLLM_WHEEL_URL%%\?*}" | python3 -c 'import sys,urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))')"
                  curl -fsSL -o "$WHEEL" "$VLLM_WHEEL_URL"
                  echo "$VLLM_WHEEL_SHA256  $WHEEL" | sha256sum -c -
                  echo "wheel verified: $WHEEL"

                # **The entrypoint is a shell, and that is not decoration.**
                # A CUDA 12.9 engine on a host running an older driver needs the
                # forward-compatibility libraries on `LD_LIBRARY_PATH`, and
                # `ENTRYPOINT ["python3", ...]` has nowhere to put them. AWS
                # publishes exactly this detection: compare the running driver
                # against the compat package's ceiling and prepend the directory
                # only when the driver is the older one.
                #
                # **Deciding at boot rather than at build** is what makes the
                # image work on any inference AMI. The newest is driver 550 /
                # CUDA 12.4 and needs compat; a future one will not, and on that
                # host this is a no-op that says so in the log.
                - |
                  cat > entrypoint.sh <<'SHIM'
                  #!/bin/bash
                  set -euo pipefail

                  verlt() {
                      [ "$1" = "$2" ] && return 1 || \
                      [ "$1" = "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" ]
                  }

                  if [ -f /usr/local/cuda/compat/libcuda.so.1 ]; then
                      CEILING=$(readlink /usr/local/cuda/compat/libcuda.so.1 | cut -d'.' -f 3-)
                      DRIVER=$(sed -n 's/^NVRM.*Kernel Module *\([0-9.]*\).*$/\1/p' \
                               /proc/driver/nvidia/version 2>/dev/null || true)
                      echo "cuda compat ceiling ${CEILING}, host driver ${DRIVER:-unknown}"
                      if [ -n "$DRIVER" ] && verlt "$DRIVER" "$CEILING"; then
                          export LD_LIBRARY_PATH=/usr/local/cuda/compat:${LD_LIBRARY_PATH:-}
                          echo "cuda compat enabled: $LD_LIBRARY_PATH"
                      else
                          echo "cuda compat not needed for this driver"
                      fi
                  else
                      echo "cuda compat absent from this image"
                  fi

                  exec python3 /opt/serve.py "$@"
                  SHIM
                  chmod +x entrypoint.sh

                # **Unquoted heredoc, deliberately.** With `<<'EOF'` the shell
                # expands nothing and the Dockerfile would carry the literal
                # string ${VLLM_VERSION}, pinning nothing and failing at build.
                - |
                  cat > Dockerfile <<EOF
                  FROM nvcr.io/nvidia/cuda@${CUDA_BASE_DIGEST}
                  ENV DEBIAN_FRONTEND=noninteractive PIP_NO_CACHE_DIR=1 \
                      PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 \
                      HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
                  # **gcc, g++ and the Python headers are runtime dependencies,
                  # not build tools.** Triton JIT-compiles its CUDA utils module
                  # from C source at engine start — after the weights have
                  # loaded, on a billing GPU — and raises "Failed to find C
                  # compiler" without one. Learned from the first run of this
                  # image: 4/4 shards loaded in 2 seconds, then this.
                  # `ninja-build` joined after gcc did: flashinfer JIT-compiles
                  # its sampling kernels at engine warmup and drives the build
                  # with ninja — exit 127 on a GPU that had already loaded the
                  # weights and compiled a triton graph. The JIT toolchain is
                  # three tools, not one, and each was discovered one billing
                  # run at a time.
                  RUN apt-get update && apt-get install -y --no-install-recommends \
                        python3 python3-pip python3-dev ca-certificates gcc g++ ninja-build \
                   && rm -rf /var/lib/apt/lists/*
                  COPY ${WHEEL} /tmp/${WHEEL}
                  # `--break-system-packages` because 24.04 marks its Python
                  # externally managed (PEP 668) and pip otherwise refuses to
                  # install into it at all. There is no virtualenv here on
                  # purpose: the container is the environment.
                  RUN pip install --no-cache-dir --break-system-packages \
                        "/tmp/${WHEEL}" "${TORCH_PIN}" \
                        --extra-index-url https://download.pytorch.org/whl/cu129 \
                   && rm -f "/tmp/${WHEEL}"
                  COPY serve.py /opt/serve.py
                  COPY tokenizer_runtime.py /opt/tokenizer_runtime.py
                  COPY entrypoint.sh /opt/entrypoint.sh
                  EXPOSE 8080
                  ENV MODEL_PATH=/opt/ml/model VLLM_VERSION=${VLLM_VERSION}
                  ENTRYPOINT ["/opt/entrypoint.sh"]
                  EOF
                - docker build --platform linux/amd64 -t "$URI:$TAG" .
                # Verify what was actually produced rather than what was asked
                # for: a builder that assumes its own platform is how an arm64
                # image reaches an x86 endpoint and fails at first boot.
                - |
                  ARCH=$(docker image inspect "$URI:$TAG" --format '{{.Architecture}}')
                  [ "$ARCH" = "amd64" ] || { echo "built $ARCH, expected amd64"; exit 1; }
                # **Everything below runs inside the built image and none of
                # it needs a GPU.** That is the whole design: each is a question
                # whose wrong answer would otherwise be discovered at first
                # inference, on an instance billing by the hour, where it reads
                # as a bad model rather than as a wrong engine.

                # The compat libraries the entrypoint expects. **Asserted, not
                # assumed** — every nvidia/cuda image is supposed to carry
                # `cuda-compat`, and an image that quietly did not would leave
                # the shim printing "absent" and the engine unable to see the
                # GPU on any current inference AMI.
                - |
                  docker run --rm --entrypoint bash "$URI:$TAG" -c '
                  test -f /usr/local/cuda/compat/libcuda.so.1 || {
                    echo "no /usr/local/cuda/compat/libcuda.so.1: a CUDA 12.9 engine cannot run on a driver-550 host without it" >&2
                    exit 1; }
                  echo "cuda compat present: $(readlink /usr/local/cuda/compat/libcuda.so.1)"'

                # A dependency graph the installer left broken. pip resolves and
                # then shrugs; this is where the shrug becomes a failure.
                - docker run --rm --entrypoint pip "$URI:$TAG" check

                # **The wheel and the version must be the same claim.** The URL
                # and `VLLM_VERSION` are two parameters and nothing else makes
                # them agree — a mismatched pair would tag the image with one
                # engine and install another. `startswith` rather than equality
                # because the installed wheel reports the local version
                # (`0.27.1+cu129`) that the tag cannot carry.
                - |
                  docker run --rm --entrypoint python3 "$URI:$TAG" -c '
                  import os, sys, vllm, torch

                  declared = os.environ["VLLM_VERSION"]
                  if not vllm.__version__.startswith(declared):
                      sys.exit("image declares vLLM %s and has %s installed"
                               % (declared, vllm.__version__))
                  # The engine wheel and the base image are pinned separately
                  # and must name the same CUDA; a 12.4 base under a cu129 wheel
                  # is a runtime failure with a very confusing message.
                  if (torch.version.cuda or "").split(".")[:2] != ["12", "9"]:
                      # **Name the build, not just the mismatch.** The first time
                      # this fired it said only "CUDA 13.0", and which torch had
                      # been chosen — and therefore what to pin — cost a whole
                      # build to find out of an incomplete log.
                      sys.exit("torch %s reports CUDA %r, expected 12.9 to match "
                               "the engine wheel; pin TORCH_PIN at the +cu129 build"
                               % (torch.__version__, torch.version.cuda))
                  print("engine:", vllm.__version__,
                        "torch:", torch.__version__, "cuda:", torch.version.cuda)
                  '

                # **The JIT toolchain triton demands at engine start.** After
                # the weights load, triton compiles a C extension on the spot:
                # it looks for a C compiler (CC, then cc/gcc/clang on PATH) and
                # includes Python.h. Neither existed in the first image to run,
                # so the engine died *after* a flawless 2-second weight load.
                # The full reproduction — `CudaUtils()` — cannot run here: its
                # link step wants the libcuda the NVIDIA runtime injects on a
                # real host. So the gate asserts the two named preconditions,
                # which are exactly what the error message names.
                - |
                  docker run --rm --entrypoint python3 "$URI:$TAG" -c '
                  import os, shutil, sys, sysconfig

                  compiler = os.environ.get("CC") or shutil.which("cc") \
                      or shutil.which("gcc") or shutil.which("clang")
                  if not compiler:
                      sys.exit("no C compiler in the image; triton raises "
                               "\"Failed to find C compiler\" at engine start, "
                               "after the weights have loaded on a billing GPU")
                  header = os.path.join(sysconfig.get_paths()["include"], "Python.h")
                  if not os.path.exists(header):
                      sys.exit("no Python.h (%s); triton compiles a CPython "
                               "extension and cannot without it" % header)
                  # flashinfer builds its warmup kernels with ninja; without it
                  # the engine dies at exit 127 *after* the triton graph has
                  # compiled, which is as late as a toolchain failure can be.
                  ninja = shutil.which("ninja")
                  if not ninja:
                      sys.exit("no ninja in the image; flashinfer JIT fails at "
                               "engine warmup with exit 127 on a billing GPU")
                  print("jit toolchain present:", compiler, "and", ninja)
                  '

                # **The engine's own lazy imports, walked before a GPU has
                # to.** Importing `vllm` proves almost nothing: the module that
                # killed the first real load was two levels deeper and is
                # imported only when the compilation backend is built, which
                # happens after the weights are mounted and the instance is
                # billing. `flashinfer.comm` annotated `array.array[int]` at
                # module scope, which Python 3.10 evaluates and refuses, and the
                # engine died having loaded nothing.
                #
                # So the gate reaches for the backend the way the engine does.
                # It needs no GPU: the failure is at import, not at execution.
                - |
                  docker run --rm --entrypoint python3 "$URI:$TAG" -c '
                  import sys

                  try:
                      import vllm.compilation.backends  # noqa: F401
                  except Exception as failure:
                      sys.exit(
                          "the engine cannot build its compilation backend on "
                          "this image: %r. This is the import chain that runs "
                          "after the weights are mounted, so it fails on a "
                          "billing GPU rather than here." % (failure,))
                  print("compilation backend imports:", sys.version.split()[0])
                  '

                # **The engine must recognise this exact architecture.**
                # A version string proves nothing about what a build can load,
                # and `startswith("Qwen3")` proves almost as little: a build
                # supporting Qwen3 but not Qwen3.5 passes it, which is precisely
                # the case in question. The model's own config declares
                # `Qwen3_5ForConditionalGeneration`, so that is what is required.
                #
                # **Here because this is the image with vLLM in it.** It was
                # briefly in the gateway build, which has neither vLLM nor
                # VLLM_VERSION, so it failed every gateway build for a reason
                # that had nothing to do with the gateway.
                - |
                  docker run --rm --entrypoint python3 "$URI:$TAG" -c '
                  import sys

                  required = "Qwen3_5ForConditionalGeneration"
                  try:
                      from vllm.model_executor.models import ModelRegistry
                      known = set(ModelRegistry.get_supported_archs())
                  except Exception as failure:
                      sys.exit("cannot enumerate supported architectures: %r" % (failure,))
                  if required not in known:
                      near = sorted(a for a in known if a.startswith("Qwen3"))
                      sys.exit(
                          "this vLLM build does not support %s; it lists %s. "
                          "It would fail to load these weights on a billing GPU."
                          % (required, near or "no Qwen3 architecture"))
                  print("architecture supported:", required)
                  '

                # **`language_model_only` must be a real engine argument.**
                # It is documented as the CLI flag `--language-model-only` and
                # not as a Python keyword, so `serve.py` passing it is a guess
                # until something checks. This checks — a wrong guess is a
                # `TypeError` at `LLM(...)`, which happens after the weights are
                # mounted on a GPU that is already charging.
                #
                # It is worth passing: the staged checkpoint is the hybrid
                # `ForConditionalGeneration` one and carries a vision tower this
                # product never sends anything to.
                - |
                  docker run --rm --entrypoint python3 "$URI:$TAG" -c '
                  import dataclasses, sys
                  from vllm.engine.arg_utils import EngineArgs

                  fields = {f.name for f in dataclasses.fields(EngineArgs)}
                  if "language_model_only" not in fields:
                      near = sorted(f for f in fields if "language" in f or "modal" in f)
                      sys.exit(
                          "EngineArgs has no language_model_only; serve.py would "
                          "raise TypeError on a billing GPU. Nearest: %s" % (near,))
                  print("engine argument present: language_model_only")
                  '

                # **The first inference must not be the first time the schema
                # is tried.** `serve.py` builds structured-output params under
                # whichever name this engine uses; if neither exists it refuses
                # rather than answering unconstrained, and that refusal belongs
                # here rather than in front of a reader.
                - |
                  docker run --rm --entrypoint python3 \
                    -v "$PWD/output_schema.json:/tmp/output_schema.json:ro" \
                    -e PYTHONPATH=/opt "$URI:$TAG" -c '
                  import json, sys
                  sys.path.insert(0, "/opt")
                  import serve

                  schema = json.load(open("/tmp/output_schema.json"))
                  params = serve._structured_params(schema, 128)
                  constrained = (getattr(params, "structured_outputs", None)
                                 or getattr(params, "guided_decoding", None))
                  if constrained is None:
                      sys.exit("params carry no schema constraint; the engine "
                               "would answer prose and fail acceptance")
                  print("structured output constructed:", type(constrained).__name__)
                  '
                - docker push "$URI:$TAG"
                - |
                  DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" \
                    --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
                  echo "SERVING_IMAGE_DIGEST=$DIGEST"
                  echo "$URI@$DIGEST"

  # -- the gateway image ----------------------------------------------------
  # **Here rather than in the gateway stack, because this file is where images
  # are built.** The gateway image was previously built on a laptop, which is
  # exactly the path this stack exists to close: an artifact whose provenance is
  # "somebody's machine, at some point" cannot be reconciled against a commit
  # afterwards, and that is not hypothetical — the deployed gateway was built
  # ten minutes before the transport was corrected, and nothing could tell.
  #
  # It pushes to the repository the gateway stack consumes. That repository is
  # named rather than created here: it already exists, and adopting it into a
  # template would mean a stack that can delete it.
  BuildGatewayImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-build-gateway-image
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: push-one-repository-and-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/written-semantic-gateway
              # No model bucket, no KMS, no SageMaker. It builds one image.
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*

  BuildGatewayImage:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: written-build-gateway-image
      ServiceRole: !GetAtt BuildGatewayImageRole.Arn
      TimeoutInMinutes: 60
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY
            Value: written-semantic-gateway
          - Name: ACCOUNT
            Value: !Ref 'AWS::AccountId'
          - Name: REGION
            Value: !Ref 'AWS::Region'
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                # One script, with its own `set -euo pipefail`. A CodeBuild
                # phase runs its entries in one shell session but does not carry
                # `set -e` between them, so a multi-step job that must stop on
                # the first failure has to be one step.
                - |
                  set -euo pipefail

                  # **No vLLM gate here.** This job builds the gateway, which
                  # contains no engine and sets no `VLLM_VERSION` — the refusal
                  # that used to sit at this line therefore failed every gateway
                  # build for a reason that had nothing to do with the gateway.
                  # The pin and the architecture check both belong to the
                  # serving image, and both are in `BuildImage`.
                  COMMIT="$(printf '%s' "${WRITTEN_SOURCE_COMMIT:-}" | cut -c1-12)"
                  if [ -z "$COMMIT" ]; then
                    echo "WRITTEN_SOURCE_COMMIT is unset. An image that cannot name its source is the defect this job exists to remove." >&2
                    exit 1
                  fi

                  # **The whole tree at the pinned commit.** The gateway image
                  # copies the contract, its schemas and written_ontology, so
                  # fetching individual files by name would silently miss one.
                  curl -fsSL -o source.tar.gz \
                    "https://codeload.github.com/Shinghei98/Written/tar.gz/$WRITTEN_SOURCE_COMMIT"
                  mkdir -p src && tar xzf source.tar.gz -C src --strip-components=1
                  cd src
                  test -f aws/gateway/Dockerfile
                  test -f semantic/contracts/compiled_semantic_contract_v1.json

                  # The contract inside the image must be the one this commit
                  # compiled. A stale artifact committed by accident would
                  # otherwise be baked in and attested as current.
                  python3 - <<'CHECK'
                  import json, pathlib, sys
                  c = json.loads(pathlib.Path(
                      "semantic/contracts/compiled_semantic_contract_v1.json").read_text())
                  v = c["versions"]
                  bad = [k for k in ("model_revision", "gateway_revision")
                         if str(v.get(k, "")).startswith("pin_")]
                  if bad:
                      sys.exit(f"the contract still carries placeholders: {bad}")
                  print("contract revisions:", v["model_revision"], v["gateway_revision"])
                  CHECK

                  aws ecr get-login-password --region "$REGION" \
                    | docker login --username AWS --password-stdin "$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
                  URI="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY"
                  TAG="gw-$COMMIT"

                  docker build --platform linux/amd64 -f aws/gateway/Dockerfile -t "$URI:$TAG" .
                  ARCH=$(docker image inspect "$URI:$TAG" --format '{{.Architecture}}')
                  [ "$ARCH" = "amd64" ] || { echo "built $ARCH, expected amd64"; exit 1; }

                  # **Both checks run before the push, which is what makes them
                  # gates.** Run afterwards they would be a report on an image
                  # already in the registry, and an IMMUTABLE repository cannot
                  # take the tag back.
                  #
                  # The first proves the layout actually imports. Every module
                  # here reaches the others by bare name through PYTHONPATH, and
                  # a mistake in that path does not fail the build — it fails at
                  # the first invocation, as an ImportError inside a Lambda.
                  echo "==> the modules import in the image as laid out"
                  docker run --rm --entrypoint python "$URI:$TAG" -c \
                    'import handler, server, ticket_store, sagemaker_transport'

                  # The second proves the image's own sources hash to what its
                  # own contract claims. This is the check that would have caught
                  # a gateway built ten minutes before its transport was
                  # corrected — measured inside the image rather than asserted
                  # about it from outside.
                  echo "==> the image agrees with the contract it carries"
                  docker run --rm --entrypoint python "$URI:$TAG" -c '
                  import json, os, pathlib
                  from written_ontology.gateway_revision import gateway_revision

                  root = pathlib.Path(os.environ["LAMBDA_TASK_ROOT"])
                  contract = json.loads(
                      pathlib.Path(os.environ["WRITTEN_SEMANTIC_CONTRACT"]).read_text()
                  )
                  measured = gateway_revision(root)
                  expected = contract["versions"]["gateway_revision"]
                  if measured != expected:
                      raise SystemExit(
                          f"gateway_revision disagrees: image {measured} contract {expected}")
                  print("gateway_revision", measured)
                  '

                  docker push "$URI:$TAG"

                  DIGEST=$(aws ecr describe-images --repository-name "$REPOSITORY" \
                    --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
                  echo "GATEWAY_SOURCE_COMMIT=$WRITTEN_SOURCE_COMMIT"
                  echo "GATEWAY_IMAGE_TAG=$TAG"
                  echo "GATEWAY_IMAGE_DIGEST=$DIGEST"
                  echo "$URI@$DIGEST"

  # -- the dead-man's switch ------------------------------------------------
  # **A trap in a shell script is not a spending cap.** It does not run if the
  # laptop sleeps, the network drops, the terminal is closed or the process is
  # SIGKILLed — and those are the cases where a GPU is left running, not the
  # tidy failures. So the deadline is also held by something that does not
  # depend on the machine that started it.
  #
  # EventBridge Scheduler calls `sagemaker:DeleteEndpoint` at a one-shot time
  # computed from the budget and the live hourly rate. Deleting the endpoint is
  # what stops the instance charge; the stack shell costs nothing and can be
  # cleaned up afterwards.
  #
  # The role can delete endpoints and **nothing else** — not the model, not the
  # config, not the stack. A wider grant would let a scheduled job dismantle
  # things whose absence is harder to notice than a stopped endpoint.
  TeardownSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-qwen-teardown
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: delete-the-endpoint-and-nothing-else
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sagemaker:DeleteEndpoint
                Resource: !Sub arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/written-qwen-*

Outputs:
  ModelBucketName:
    Value: !Ref ModelBucket
  ModelKeyArn:
    Value: !GetAtt ModelKey.Arn
  ServingRepositoryUri:
    Value: !GetAtt ServingRepository.RepositoryUri
  StageWeightsProject:
    Value: !Ref StageWeights
  BuildImageProject:
    Value: !Ref BuildImage
  BuildGatewayImageProject:
    Value: !Ref BuildGatewayImage
  TeardownSchedulerRoleArn:
    Value: !GetAtt TeardownSchedulerRole.Arn
