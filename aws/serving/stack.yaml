AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The Qwen serving endpoint: SageMaker asynchronous inference on one g6e, a
  custom vLLM image pinned by digest, weights mounted from an immutable S3
  prefix, and autoscaling to zero.

  Separate from the gateway stack on purpose. This one costs money whenever an
  instance is up, and a template that created it as a side effect of deploying a
  Lambda would make that a surprise rather than a decision.

Parameters:
  ServingImageUri:
    Type: String
    Description: The vLLM image in ECR, by digest rather than by tag.
  ModelDataS3Uri:
    Type: String
    Description: s3://.../qwen3.5-9b/<revision>/ — the staged, checksummed weights.
  AsyncOutputBucket:
    Type: String
    Default: written-semantic-async-616040526027
  ModelKeyArn:
    Type: String
    Default: arn:aws:kms:us-east-1:616040526027:key/02db116c-2490-468b-aadc-695377d2678a
    Description: >
      The customer-managed key the model bucket is encrypted with. Named here
      because the artifact stack owns it and this one is deliberately separate.
  InstanceType:
    Type: String
    Default: ml.g6e.xlarge
    Description: >
      The first-priority instance pool. One 48 GB L40S by default. BF16,
      text-only, context bounded by the contract.
  FallbackInstanceTypeA:
    Type: String
    Default: ''
    Description: >
      Second-priority pool, empty for none. **Capacity pools are independent per
      instance type**, and the first evaluation invocation waited two-plus hours
      on one dry pool while its sibling had quota — SageMaker provisions from
      the lowest priority with capacity, so each named fallback multiplies the
      odds a wake-from-zero finds an instance at all.
  FallbackInstanceTypeB:
    Type: String
    Default: ''
    Description: Third-priority pool, empty for none.

Conditions:
  HasFallbackA: !Not [!Equals [!Ref FallbackInstanceTypeA, '']]
  HasFallbackB: !Not [!Equals [!Ref FallbackInstanceTypeB, '']]

Resources:
  ServingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: written-qwen-serving
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-weights-write-answers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # **Read the weights, and only read them.** An endpoint that could
              # write to the model prefix could change what it is next time.
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::written-semantic-models-${AWS::AccountId}
                  - !Sub arn:aws:s3:::written-semantic-models-${AWS::AccountId}/*
              # **Reading a KMS-encrypted object needs the key as well as the
              # object.** The bucket is SSE-KMS with a customer-managed key, so
              # `s3:GetObject` alone answers `AccessDenied` at download and the
              # endpoint fails to start — a permission failure that looks like a
              # missing artifact. `DescribeKey` is not decoration: S3 calls it
              # when resolving the bucket key.
              - Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !Ref ModelKeyArn
              # The async output bucket is SSE-S3, so writing the answer needs
              # no key. Were it ever moved to SSE-KMS this would need
              # `kms:GenerateDataKey` as well, and the write would fail silently
              # from the container's point of view until it did.
              # It writes the answer and nothing else; the gateway deletes it.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${AsyncOutputBucket}/async/*
              # **`ListBucket` on the async bucket, and SageMaker checks for it
              # before the endpoint exists.** Nothing in this container lists
              # that bucket — it writes one object per answer — but endpoint
              # creation validates the role against a fixed expectation and
              # refuses without it:
              #
              #   The provided role is invalid. Please ensure the role exists,
              #   that its trust relationship policy allows sts:AssumeRole for
              #   sagemaker.amazonaws.com and has "s3:ListBucket", and
              #   "s3:PutObject" permissions for bucket ...
              #
              # The message names three unrelated causes for one refusal, and
              # the true one was the third. It is bucket-level rather than
              # `/*`: a list is an operation on the bucket, and scoping it to a
              # prefix grants nothing SageMaker looks for.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${AsyncOutputBucket}
              # **Pulling the image is a permission, not a consequence of
              # naming it.** The role could read the weights and decrypt them
              # and had no way to fetch the container that would do it, so the
              # endpoint would have failed at image pull — which reads as a bad
              # digest rather than a missing grant. `GetAuthorizationToken` is
              # account-level and takes `*`; the other three are scoped to the
              # one repository, because a serving role that could pull any image
              # could run one nobody attested.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/written-qwen-serving
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:CreateLogGroup]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*

  Model:
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: !Sub written-qwen-${AWS::StackName}
      ExecutionRoleArn: !GetAtt ServingRole.Arn
      # **Isolation is a setting, not a consequence of not configuring a VPC.**
      # An inference container has outbound network access by default, so
      # "no VPC is configured" bought nothing: `HF_HUB_OFFLINE` is a courtesy
      # the container extends to itself and anything running in it could reach
      # the internet with somebody's title in hand. This removes the route.
      #
      # It does not impede the things that look like network: the platform
      # downloads model data and uploads async answers outside the container,
      # and CloudWatch logging is done by the agent rather than by us.
      EnableNetworkIsolation: true
      PrimaryContainer:
        Image: !Ref ServingImageUri
        Mode: SingleModel
        ModelDataSource:
          S3DataSource:
            S3Uri: !Ref ModelDataS3Uri
            S3DataType: S3Prefix
            CompressionType: None
        Environment:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          WRITTEN_MAX_MODEL_LEN: '8192'
          # **The container cannot learn its own digest**, so the deployment
          # tells it — the same shape as the gateway's. It reports this in the
          # runtime block, which is the only place the answer's author is
          # recorded; without it the field was simply absent and the gateway's
          # drift check treated absence as disagreement.
          # **Derived from the URI, so the two cannot disagree.** Taking the
          # digest as its own parameter meant two independently supplied values
          # describing one image, and the failure would be silent: a container
          # attesting a digest it is not running, with the gateway comparing
          # against the declaration rather than the thing. `ServingImageUri` is
          # pinned by digest, so the digest is already in it.
          WRITTEN_SERVING_IMAGE_DIGEST: !Select [1, !Split ['@', !Ref ServingImageUri]]

  EndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      # **No fixed name, deliberately.** EndpointConfig is immutable, so any
      # change here replaces it — and a replacement cannot be created under the
      # name the old one still holds. The *endpoint's* name is the stable
      # identity everything keys on (the gateway, the teardown, the deadline);
      # the config's name identifies nothing and CloudFormation may generate it.
      AsyncInferenceConfig:
        OutputConfig:
          S3OutputPath: !Sub s3://${AsyncOutputBucket}/async/out/
          S3FailurePath: !Sub s3://${AsyncOutputBucket}/async/fail/
        ClientConfig:
          # One at a time. The lane is singleton-first until a deployed
          # distribution says otherwise.
          MaxConcurrentInvocationsPerInstance: 1
      ProductionVariants:
        - VariantName: primary
          ModelName: !GetAtt Model.ModelName
          # **Priority-ordered pools, not one type.** SageMaker provisions from
          # the lowest priority that has capacity; a dry first pool falls
          # through instead of stalling the wake for hours. All pools run the
          # same digest-pinned image and mount the same weights, so nothing
          # attested varies — `runtime.json.gpu` is recorded, never compared.
          InstancePools: !If
            - HasFallbackB
            - - { InstanceType: !Ref InstanceType, Priority: 1 }
              - { InstanceType: !Ref FallbackInstanceTypeA, Priority: 2 }
              - { InstanceType: !Ref FallbackInstanceTypeB, Priority: 3 }
            - !If
              - HasFallbackA
              - - { InstanceType: !Ref InstanceType, Priority: 1 }
                - { InstanceType: !Ref FallbackInstanceTypeA, Priority: 2 }
              - - { InstanceType: !Ref InstanceType, Priority: 1 }
          InitialInstanceCount: 1
          ModelDataDownloadTimeoutInSeconds: 1800
          ContainerStartupHealthCheckTimeoutInSeconds: 1800

  Endpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: !Sub written-qwen-${AWS::StackName}
      EndpointConfigName: !GetAtt EndpointConfig.EndpointConfigName

  # **Scale to zero.** Async endpoints may go to nought instances, which is the
  # whole reason this lane is asynchronous: the work is bursty and a g6e is not.
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: Endpoint
    Properties:
      ServiceNamespace: sagemaker
      ResourceId: !Sub endpoint/${Endpoint.EndpointName}/variant/primary
      ScalableDimension: sagemaker:variant:DesiredInstanceCount
      MinCapacity: 0
      MaxCapacity: 1
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/sagemaker.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_SageMakerEndpoint

  # **Target tracking cannot start the first instance.**
  # `ApproximateBacklogSizePerInstance` is a per-instance metric and there are no
  # instances at rest, so it publishes nothing and the policy has nothing to act
  # on: a request arriving at zero capacity would sit in the queue until the
  # invocation timed out. `HasBacklogWithoutCapacity` is the metric that exists
  # precisely for this state — a backlog with no capacity behind it — and a step
  # policy on it is what turns one instance on. Target tracking then does the
  # ordinary work once something is running. Both are needed; neither replaces
  # the other.
  WakeFromZeroPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: written-qwen-wake-from-zero
      PolicyType: StepScaling
      ScalingTargetId: !Ref ScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        # One instance, because MaxCapacity is one. The cooldown is long enough
        # that a burst does not ask for a second start while the first is still
        # loading a 19 GB model.
        Cooldown: 600
        MetricAggregationType: Average
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            ScalingAdjustment: 1

  BacklogWithoutCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub written-qwen-${AWS::StackName}-backlog-without-capacity
      AlarmDescription: >
        Work is queued and nothing is running. Starts the one instance.
      Namespace: AWS/SageMaker
      MetricName: HasBacklogWithoutCapacity
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # **`missing`, not `breaching` and not `notBreaching`.** The metric is not
      # published while the endpoint is idle and empty, and treating that
      # absence as either answer would make the alarm state a guess about a
      # thing that said nothing.
      TreatMissingData: missing
      Dimensions:
        - Name: EndpointName
          Value: !GetAtt Endpoint.EndpointName
      AlarmActions:
        - !Ref WakeFromZeroPolicy

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: written-qwen-queue-depth
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1
        CustomizedMetricSpecification:
          MetricName: ApproximateBacklogSizePerInstance
          Namespace: AWS/SageMaker
          Statistic: Average
          Dimensions:
            - Name: EndpointName
              Value: !GetAtt Endpoint.EndpointName
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  EndpointName:
    Value: !GetAtt Endpoint.EndpointName
