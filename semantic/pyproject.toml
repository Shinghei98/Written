[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "written-ontology"
version = "0.3.1"
description = "Typed, privacy-gated semantic decision core and persistence contract for Written"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
semantic = ["sentence-transformers>=3,<6"]
# `openpyxl` reads `ontology/terms.xlsx` in `tools/compile_semantic_contract.py`.
# **A dev/CI dependency, deliberately not a runtime one.** Nothing in the Lambda
# opens the workbook, so the bundle carries no spreadsheet and no reader for one.
#
# **The worker now does consume `contracts/compiled_semantic_contract_v1.json`**,
# through `written_ontology.semantic_contract`. It did not when this comment first
# claimed so, and saying it here made it look settled; it did not when the claim
# was withdrawn either. `aws/worker/build.sh` stages the JSON beside the module
# and prints `release_build_sha256`, `CodeSha256` and `compiled_contract_sha256`,
# so what shipped can be compared with what was attested. The workbook is still
# read by nothing at runtime, which is why `openpyxl` stays a dev extra.
# `jsonschema` validates the few-shot registry entries against
# `mention_extract_v1` — the spec requires every stored example to be a complete,
# schema-valid outer response, because a malformed few-shot teaches the model the
# malformed shape.
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4", "jsonschema>=4.20,<5"]

[project.scripts]
written-ontology = "written_ontology.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
