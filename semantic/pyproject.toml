[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "written-ontology"
version = "0.3.1"
description = "Typed, privacy-gated semantic decision core and persistence contract for Written"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
semantic = ["sentence-transformers>=3,<6"]
# `openpyxl` reads `ontology/terms.xlsx` in `tools/compile_semantic_contract.py`.
# **A dev/CI dependency, deliberately not a runtime one.** Nothing in the Lambda
# opens the workbook, so `aws/worker/build.sh` needs no change and the bundle does
# not grow.
#
# **What the earlier version of this comment claimed — that the worker consumes
# `contracts/compiled_semantic_contract_v1.json` — is not true yet**, and saying
# so here made it look settled. Audited: no build script stages either artifact
# into any ZIP, and the only non-test readers of both files are the compiler that
# writes one and the tests. They are verified outputs, not inputs. The commit that
# makes a consumer real is the one that must also ship the JSON in the bundle and
# hash what it shipped, which is what `release_build_sha256` is reserved for.
# `jsonschema` validates the few-shot registry entries against
# `mention_extract_v1` — the spec requires every stored example to be a complete,
# schema-valid outer response, because a malformed few-shot teaches the model the
# malformed shape.
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4", "jsonschema>=4.20,<5"]

[project.scripts]
written-ontology = "written_ontology.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
